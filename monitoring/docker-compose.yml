services:

  # =========================
  # Stable and canary BentoML APIs
  # =========================
  sentiment-stable:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${SENTIMENT_STABLE_IMAGE:-arabic-sentiment:stable}
    expose:
      - "8000"
    restart: unless-stopped

  sentiment-canary:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${SENTIMENT_CANARY_IMAGE:-arabic-sentiment:canary}
    expose:
      - "8000"
    restart: unless-stopped


  # =========================
  # Weighted request routing
  # =========================
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sentiment-stable
      - sentiment-canary
    restart: unless-stopped


  # =========================
  # Prometheus
  # =========================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - sentiment-stable
      - sentiment-canary
      - cadvisor
    restart: unless-stopped


  # =========================
  # cAdvisor
  # =========================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped


  # =========================
  # Grafana
  # =========================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: "${SMTP_USER}"
      GF_SMTP_PASSWORD: "${SMTP_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "${SMTP_USER}"
      GF_SMTP_FROM_NAME: "Grafana Alerts"
      GF_SMTP_STARTTLS_POLICY: "Mandatory"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped


volumes:
  prometheus_data:
  grafana_data: