global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:

  # Scrape the APIs directly so both rollout cohorts remain observable.
  - job_name: "sentiment-stable"
    static_configs:
      - targets: ["sentiment-stable:8000"]
        labels:
          rollout: stable

  - job_name: "sentiment-canary"
    static_configs:
      - targets: ["sentiment-canary:8000"]
        labels:
          rollout: canary

  # cAdvisor
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]