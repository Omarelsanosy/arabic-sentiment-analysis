[project]
name = "arabic-sentiment-analysis"
version = "0.1.0"
description = "Arabic sentiment analysis project"
readme = "README.md"
authors = [
    { name = "Omar Elsanosy", email = "amr205869@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bentoml>=1.4.30",
    "evidently>=0.7.23",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[project.scripts]
arabic-sentiment-analysis = "arabic_sentiment_analysis:main"
arabic-sentiment-export-onnx = "arabic_sentiment_analysis.export_onnx:main"

[project.optional-dependencies]
onnx = [
    "onnx>=1.17.0",
    "onnxruntime>=1.31.0",
]
tensorrt = [
    "cuda-python>=13.4,<14",
    "tensorrt-cu12==11.4.0.106",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["notebooks", "mlruns", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["arabic_sentiment_analysis"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "locust>=2.46.6",
]
